<!--
  Generado con IA (Claude - ERC AI Workspace) - Restringido
  Tableros ERC, versión 2 (PWA)
  Para agregar un tablero nuevo: añada una tarjeta en <main> y su entrada en el objeto TABLEROS del script.
-->
<!DOCTYPE html>
<html lang="es-GT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tableros ERC</title>
<meta name="theme-color" content="#24537F">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tableros ERC">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#29A9E0; --marino:#24537F; --pizarra:#3A4E6E; --fondo:#F5F8FB; --gris:#5E6B7A; --linea:#DCE4EC;
    --top:env(safe-area-inset-top,0px); --bottom:env(safe-area-inset-bottom,0px);
    --clasif-h:calc(var(--top) + 24px); --barra:46px;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:17px;line-height:1.5;color:var(--pizarra);background:var(--fondo);
    -webkit-text-size-adjust:100%;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  :focus-visible{outline:3px solid var(--azul);outline-offset:2px}

  /* Encabezado de clasificación y atribución (requerido por política de ERC) */
  .clasif{
    position:fixed;inset:0 0 auto 0;z-index:50;
    padding:calc(var(--top) + 4px) 14px 4px;
    background:var(--fondo);color:var(--gris);border-bottom:1px solid var(--linea);
    font-size:11.5px;line-height:1.4;text-align:center;
  }

  /* ---------- Inicio ---------- */
  #inicio{
    min-height:100%;max-width:560px;margin:0 auto;
    padding:calc(var(--clasif-h) + 40px) 20px calc(var(--bottom) + 28px);
    display:flex;flex-direction:column;
  }
  .logo{display:block;width:min(240px,62vw);height:auto;margin:0 auto 40px}

  .tarjeta{
    position:relative;display:block;overflow:hidden;border-radius:22px;text-decoration:none;color:#fff;
    aspect-ratio:4/5;max-height:62vh;width:100%;
    background:var(--marino) url("oxec-ii.jpg") center 35%/cover no-repeat;
    box-shadow:0 18px 40px -22px rgba(36,83,127,.55);
  }
  .tarjeta::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(20,40,64,0) 35%,rgba(20,40,64,.55) 62%,rgba(20,40,64,.92) 100%);
  }
  .tarjeta .texto{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:24px 22px 20px}
  .tarjeta h2{
    font-family:"Barlow Condensed",sans-serif;font-weight:600;
    font-size:clamp(34px,10vw,44px);line-height:1;letter-spacing:.005em;
  }
  .tarjeta .abrir{
    margin-top:16px;display:flex;justify-content:space-between;align-items:center;
    padding-top:14px;border-top:1px solid rgba(255,255,255,.28);font-weight:600;font-size:16px;
  }
  .tarjeta .abrir svg{width:22px;height:22px}
  .tarjeta:active{transform:scale(.99)}

  .instalar{
    margin-top:auto;padding-top:28px;font-size:14px;color:var(--gris);text-align:center;display:none;
  }
  .instalar.ver{display:block}
  .instalar button{
    margin-top:10px;background:var(--marino);color:#fff;padding:10px 20px;border-radius:10px;font-weight:600;
  }

  /* ---------- Visor ---------- */
  #visor{position:fixed;inset:0;display:none;flex-direction:column;background:var(--fondo)}
  #visor.abierto{display:flex}
  .herramientas{
    margin-top:var(--clasif-h);height:var(--barra);flex:none;
    display:flex;align-items:center;gap:4px;padding:0 6px;background:var(--marino);color:#fff;
  }
  .herramientas button,.herramientas a{
    height:40px;min-width:40px;display:inline-flex;align-items:center;justify-content:center;
    border-radius:8px;text-decoration:none;color:#fff;
  }
  .herramientas .volver{padding:0 10px 0 4px;font-weight:600;gap:2px}
  .herramientas h1{
    flex:1;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:20px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;
  }
  .herramientas svg{width:22px;height:22px}
  .marco{position:relative;flex:1;padding-bottom:var(--bottom)}
  .marco iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  .estado{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:24px;text-align:center;background:var(--fondo);color:var(--gris);
  }
  .estado[hidden]{display:none}
  .estado .boton{background:var(--marino);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;text-decoration:none}
  .pulso{width:44px;height:44px;border-radius:50%;border:4px solid var(--linea);border-top-color:var(--azul);animation:giro 1s linear infinite}
  @keyframes giro{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.pulso{animation:none}}
  @media (min-width:900px){ #inicio{padding-top:calc(var(--clasif-h) + 72px)} .tarjeta{aspect-ratio:16/10} }
</style>
</head>
<body>

<div class="clasif" role="note">Generado con IA (Claude - ERC AI Workspace) - Restringido</div>

<main id="inicio">
  <img class="logo" src="logo-erc.png" alt="ERC Capital Corp" width="900" height="286">

  <a class="tarjeta" href="#generacion" aria-label="Abrir tablero de Generación de Energía">
    <div class="texto">
      <h2>Generación de Energía</h2>
      <div class="abrir">
        <span>Abrir tablero</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </div>
    </div>
  </a>

  <div class="instalar" id="instalar">
    <span id="instalar-texto"></span><br>
    <button id="instalar-boton" hidden>Instalar app</button>
  </div>
</main>

<section id="visor" aria-live="polite">
  <div class="herramientas">
    <button class="volver" id="volver" aria-label="Volver al inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      Inicio
    </button>
    <h1 id="visor-titulo"></h1>
    <button id="recargar" aria-label="Actualizar tablero">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
    </button>
    <a id="externo" target="_blank" rel="noopener" aria-label="Abrir en el navegador">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
    </a>
  </div>
  <div class="marco">
    <iframe id="marco" title="Tablero" referrerpolicy="no-referrer"></iframe>
    <div class="estado" id="cargando"><div class="pulso"></div>Cargando tablero…</div>
    <div class="estado" id="error" hidden>
      <p>El tablero no respondió. Revise su conexión e inténtelo otra vez.</p>
      <button class="boton" id="reintentar">Intentar de nuevo</button>
      <a class="boton" id="error-externo" target="_blank" rel="noopener">Abrir en el navegador</a>
    </div>
  </div>
</section>

<script>
/* Generado con IA (Claude - ERC AI Workspace) - Restringido */
const TABLEROS = {
  generacion: {
    titulo: 'Generación de Energía',
    url: 'https://mejoracontinua-erc.github.io/Generacion-De-Energia/'
  }
};

const $ = id => document.getElementById(id);
const barra = document.querySelector('.clasif');
new ResizeObserver(() => document.documentElement.style.setProperty('--clasif-h', barra.offsetHeight + 'px')).observe(barra);

const visor = $('visor'), marco = $('marco'), cargando = $('cargando'), error = $('error');
let espera;

function abrir(clave){
  const t = TABLEROS[clave];
  if(!t){ cerrar(); return; }
  $('visor-titulo').textContent = t.titulo;
  $('externo').href = $('error-externo').href = t.url;
  visor.classList.add('abierto');
  document.title = t.titulo + ' - Tableros ERC';
  cargar(t.url);
}

function cargar(url){
  error.hidden = true; cargando.hidden = false;
  clearTimeout(espera);
  espera = setTimeout(() => { cargando.hidden = true; error.hidden = false; }, 15000);
  marco.src = 'about:blank';
  requestAnimationFrame(() => { marco.src = url + (url.includes('?') ? '&' : '?') + 'v=' + Date.now(); });
}

marco.addEventListener('load', () => {
  if(marco.src === 'about:blank' || !visor.classList.contains('abierto')) return;
  clearTimeout(espera); cargando.hidden = true;
});

function cerrar(){
  visor.classList.remove('abierto');
  marco.src = 'about:blank'; clearTimeout(espera);
  document.title = 'Tableros ERC';
}

function ruta(){ const c = location.hash.slice(1); c ? abrir(c) : cerrar(); }
window.addEventListener('hashchange', ruta);
$('volver').addEventListener('click', () => { history.length > 1 && location.hash ? history.back() : (location.hash = ''); });
$('recargar').addEventListener('click', () => { const t = TABLEROS[location.hash.slice(1)]; t && cargar(t.url); });
$('reintentar').addEventListener('click', () => $('recargar').click());
ruta();

/* Ayuda para instalar (solo aparece si la app aún no está instalada) */
const instalada = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let aviso;
if(!instalada){
  if(esIOS){
    $('instalar-texto').textContent = 'Para instalarla, toque Compartir en Safari y luego "Agregar a pantalla de inicio".';
    $('instalar').classList.add('ver');
  }
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); aviso = e;
    $('instalar-texto').textContent = 'Instale la app en su pantalla de inicio.';
    $('instalar-boton').hidden = false; $('instalar').classList.add('ver');
  });
  $('instalar-boton').addEventListener('click', async () => {
    if(!aviso) return;
    aviso.prompt(); await aviso.userChoice; aviso = null; $('instalar').classList.remove('ver');
  });
}

if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
